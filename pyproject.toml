[project]
name = "video-triage"
version = "0.1.0"
description = "Transcribe a folder of videos and route each to the right channel."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",
    "mlx-whisper>=0.4.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
video-triage = "video_triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video_triage"]
